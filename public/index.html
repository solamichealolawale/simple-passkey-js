<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadana Passkey Demo</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
            color: #1e293b;
        }

        .container {
            max-width: 480px;
            margin: 40px auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .error {
            background: #fef2f2;
            color: var(--error-color);
            border: 1px solid #fecaca;
        }

        .success {
            background: #f0fdf4;
            color: var(--success-color);
            border: 1px solid #bbf7d0;
        }

        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #64748b;
            font-weight: 500;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        #signupForm, #signinForm {
            display: none;
        }

        #signupForm.active, #signinForm.active {
            display: block;
        }

        .user-info {
            display: none;
            text-align: center;
        }

        .user-info.active {
            display: block;
        }

        .logout-btn {
            background: #ef4444;
            margin-top: 16px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadana Passkey Demo</h1>
        
        <div class="tabs">
            <div class="tab active" data-form="signup">Sign Up</div>
            <div class="tab" data-form="signin">Sign In</div>
        </div>

        <form id="signupForm" class="active">
            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" required>
            </div>
            <div class="form-group">
                <label for="signupDisplayName">Display Name</label>
                <input type="text" id="signupDisplayName" required>
            </div>
            <button type="submit">Sign Up with Passkey</button>
        </form>

        <form id="signinForm">
            <div class="form-group">
                <label for="signinEmail">Email</label>
                <input type="email" id="signinEmail" required>
            </div>
            <button type="submit">Sign In with Passkey</button>
        </form>

        <div class="user-info">
            <h2>Welcome, <span id="userDisplayName"></span>!</h2>
            <p>Email: <span id="userEmail"></span></p>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div id="message" class="message" style="display: none;"></div>
    </div>

    <script>
        // Constants
        const API_BASE = 'http://localhost:3000';
        
        // DOM Elements
        const signupForm = document.getElementById('signupForm');
        const signinForm = document.getElementById('signinForm');
        const message = document.getElementById('message');
        const userInfo = document.querySelector('.user-info');
        const tabs = document.querySelectorAll('.tab');

        // Helper Functions
        function showMessage(text, type = 'error') {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        function showUserInfo(user) {
            document.getElementById('userDisplayName').textContent = user.displayName;
            document.getElementById('userEmail').textContent = user.email;
            userInfo.classList.add('active');
            signupForm.classList.remove('active');
            signinForm.classList.remove('active');
            tabs.forEach(tab => tab.style.display = 'none');
        }

        // Tab Switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const formId = tab.dataset.form;
                
                // Update tabs
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Update forms
                signupForm.classList.remove('active');
                signinForm.classList.remove('active');
                document.getElementById(`${formId}Form`).classList.add('active');
                
                // Hide user info if shown
                userInfo.classList.remove('active');
                message.style.display = 'none';
            });
        });

        // Sign Up Handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // 1. Register user
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('signupEmail').value,
                        displayName: document.getElementById('signupDisplayName').value
                    })
                });
                
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }
                
                const { userId } = data;
                
                // 2. Start WebAuthn registration
                const regResponse = await fetch(`${API_BASE}/webauthn/registerRequest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                
                const regData = await regResponse.json();
                if (!regResponse.ok) {
                    throw new Error(regData.error || 'Failed to initiate registration');
                }
                
                const { options, challengeId } = regData;
                
                // 3. Create credentials
                const credential = await navigator.credentials.create({
                    publicKey: {
                        ...options,
                        challenge: base64URLDecode(options.challenge),
                        user: {
                            ...options.user,
                            id: base64URLDecode(options.user.id)
                        },
                        excludeCredentials: options.excludeCredentials?.map(cred => ({
                            ...cred,
                            id: base64URLDecode(cred.id)
                        }))
                    }
                });
                
                // 4. Send response to server
                const verificationResponse = await fetch(`${API_BASE}/webauthn/registerResponse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challengeId,
                        credential: {
                            id: credential.id,
                            type: credential.type,
                            response: {
                                clientDataJSON: base64URLEncode(credential.response.clientDataJSON),
                                attestationObject: base64URLEncode(credential.response.attestationObject)
                            }
                        }
                    })
                });
                
                const result = await verificationResponse.json();
                if (!verificationResponse.ok) {
                    throw new Error(result.error || 'Failed to verify registration');
                }
                
                showMessage(result.message, 'success');
                
                // Switch to signin tab
                tabs[1].click();
            } catch (error) {
                console.error('Signup error:', error);
                showMessage(error.message);
            }
        });

        // Sign In Handler
        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // 1. Get authentication options
                const response = await fetch(`${API_BASE}/webauthn/loginRequest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('signinEmail').value
                    })
                });
                
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to initiate login');
                }
                
                const { options, challengeId } = data;
                
                // 2. Get credential
                const credential = await navigator.credentials.get({
                    publicKey: {
                        ...options,
                        challenge: base64URLDecode(options.challenge),
                        allowCredentials: options.allowCredentials?.map(cred => ({
                            ...cred,
                            id: base64URLDecode(cred.id)
                        }))
                    }
                });
                
                // 3. Verify with server
                const verificationResponse = await fetch(`${API_BASE}/webauthn/loginResponse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challengeId,
                        credential: {
                            id: credential.id,
                            type: credential.type,
                            response: {
                                clientDataJSON: base64URLEncode(credential.response.clientDataJSON),
                                authenticatorData: base64URLEncode(credential.response.authenticatorData),
                                signature: base64URLEncode(credential.response.signature),
                                userHandle: credential.response.userHandle ? base64URLEncode(credential.response.userHandle) : null
                            }
                        }
                    })
                });
                
                const result = await verificationResponse.json();
                if (!verificationResponse.ok) {
                    throw new Error(result.error || 'Failed to verify login');
                }
                
                if (result.status === 'success') {
                    showUserInfo(result.user);
                    showMessage('Successfully signed in!', 'success');
                } else {
                    throw new Error(result.error || 'Login failed');
                }
            } catch (error) {
                console.error('Signin error:', error);
                showMessage(error.message);
            }
        });

        // Logout Handler
        function handleLogout() {
            userInfo.classList.remove('active');
            tabs.forEach(tab => tab.style.display = 'block');
            tabs[0].click();
        }

        // Base64URL Helpers
        function base64URLDecode(base64url) {
            const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
            const base64 = (base64url + padding)
                .replace(/-/g, '+')
                .replace(/_/g, '/');
            
            const rawData = atob(base64);
            const buffer = new Uint8Array(rawData.length);
            
            for (let i = 0; i < rawData.length; i++) {
                buffer[i] = rawData.charCodeAt(i);
            }
            return buffer;
        }

        function base64URLEncode(buffer) {
            const base64 = btoa(String.fromCharCode(...new Uint8Array(buffer)));
            return base64
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }
    </script>
</body>
</html>
